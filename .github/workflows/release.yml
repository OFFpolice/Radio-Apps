name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Version tag (e.g. v1.0.1)'
        required: true
        type: string
      title:
        description: 'Release title'
        required: false
        type: string
        default: ''
      notes:
        description: 'Release notes / Changelog'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate signing keystore (if missing)
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=WebRadioBot,O=OFFpolice,C=US"
          fi

      - name: Determine Version Tag
        id: version
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "Determined release tag: $TAG"

      - name: Build Release APK
        run: |
          gradle :app:assembleRelease

      - name: Prepare APK Asset
        run: |
          mkdir -p dist
          APK_FILE="dist/WebRadioBot-${RELEASE_TAG}-arm64-v8a.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_FILE"
          ls -lh "$APK_FILE"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ inputs.title != '' && inputs.title || format('WebRadioBot {0}', env.RELEASE_TAG) }}
          body: ${{ inputs.notes }}
          generate_release_notes: true
          files: |
            dist/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
