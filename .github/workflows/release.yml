name: Release APK

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Version tag (e.g. v1.0.1)'
        required: true
        type: string
      title:
        description: 'Release title'
        required: false
        type: string
        default: ''
      notes:
        description: 'Release notes / Changelog'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore signing keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Restoring keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fallback keystore..."
            keytool -genkey -v -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=RadioApps,O=OFFpolice,C=US"
          fi

      - name: Determine Version Tag
        id: version
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "Determined release tag: $TAG"

      - name: Build Release APK
        run: |
          gradle :app:assembleRelease

      - name: Prepare APK Assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/RadioApps-${RELEASE_TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/WebRadioBot-${RELEASE_TAG}.apk"
          ls -lh dist/

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ inputs.title != '' && inputs.title || github.event.release.name || format('Release {0}', env.RELEASE_TAG) }}
          body: ${{ inputs.notes != '' && inputs.notes || github.event.release.body }}
          generate_release_notes: false
          files: |
            dist/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
